<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart & Checkout | Black Fire</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Black Fire</a>
        <a href="cart.html" class="cart-icon">🛒 <span class="cart-count">0</span></a>
    </header>

    <div class="container cart-layout">
        <div>
            <h2 style="margin-bottom: 1.5rem; font-weight: 700;">Your Cart</h2>
            <div id="cart-items"></div>
            <h3 style="margin-top: 1.5rem; border-top: 2px solid #000; padding-top: 1rem; font-weight: 800;">Estimated Total: <span style="color: var(--accent);">₹<span id="cart-total">0</span></span></h3>
        </div>
        
        <div class="checkout-box">
            <h2>Shipping & Payment</h2>
            <form id="checkout-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="e.g. Kira Bolte" required>
                </div>
                <div class="form-group">
                    <label>Phone Number (WhatsApp)</label>
                    <input type="tel" id="phone" placeholder="+91 9022438297" required>
                </div>
                <div class="form-group">
                    <label>Full Delivery Address</label>
                    <textarea id="address" rows="3" placeholder="House/Flat No., Street, City, Pincode" required></textarea>
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <!-- Selecting UPI will now show the QR code cleanly -->
                    <select id="payment" onchange="toggleUPI()">
                        <option value="Cash on Delivery">Cash on Delivery (COD)</option>
                        <option value="UPI">Pay via UPI (GPay, PhonePe, Paytm)</option>
                    </select>
                </div>
                
                <div class="upi-section" id="upi-box">
                    <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px;">Scan QR to pay securely via any UPI app.</p>
                    <img src="https://placehold.co/200x200/ffffff/000000?text=Your+UPI+QR" alt="UPI QR Code">
                    <p style="font-weight: 700; margin-top: 10px;">UPI ID: blackfire@upi</p>
                </div>

                <button type="submit" class="btn btn-large" style="margin-top: 1.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2;">
                    <span>CHECKOUT VIA WHATSAPP</span>
                    <span style="font-size: 0.75rem; color: #ccc; margin-top: 4px; text-transform: none;">Secure COD & UPI Payments</span>
                </button>
            </form>
        </div>
    </div>

    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Simple script to show/hide the UPI QR code based on selection
        function toggleUPI() {
            const paymentMethod = document.getElementById('payment').value;
            const upiBox = document.getElementById('upi-box');
            if (paymentMethod === 'UPI') {
                upiBox.classList.add('active');
            } else {
                upiBox.classList.remove('active');
            }
        }
    </script>
</body>
</html>
